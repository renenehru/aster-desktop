[package]
name = "aster-credential-prompt"
version = "0.1.0"
license = "Apache-2.0"
description = "Isolated Windows credential prompt boundary for Aster"
homepage = "https://github.com/renenehru/aster-desktop"
repository = "https://github.com/renenehru/aster-desktop"
edition = "2024"
rust-version = "1.88.0"
publish = false

[dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials"] }
zeroize = "=1.9.0"

[lints.rust]
unsafe_code = "deny"
