[package]
name = "aster-desktop"
version = "0.2.0"
license = "Apache-2.0"
description = "Local-first Windows client for a curated multi-provider AI catalog"
homepage = "https://github.com/renenehru/aster-desktop"
repository = "https://github.com/renenehru/aster-desktop"
edition = "2024"
rust-version = "1.88.0"
publish = false

[lib]
name = "aster_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aster-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
aster-credential-prompt = { path = "credential-prompt" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] }
futures-util = { version = "=0.3.33", default-features = false, features = ["std"] }
keyring = { version = "=4.1.5", default-features = false, features = ["v1"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
raw-window-handle = "=0.6.2"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled", "limits"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-opener = "=2.5.4"
thiserror = "=2.0.18"
tokio = { version = "=1.53.0", features = ["macros", "sync", "time"] }
tokio-util = { version = "=0.7.18", features = ["rt"] }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
url = "=2.5.8"
zeroize = "=1.9.0"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[workspace]
members = [".", "credential-prompt"]
resolver = "2"
