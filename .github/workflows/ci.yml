name: Secure verification

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality and security
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Run tests with coverage gates
        run: pnpm test:coverage
      - name: Run the standalone type check
        run: pnpm typecheck
      - name: Build production frontend
        run: pnpm build
      - name: Scan tracked content for secrets
        run: pnpm security:secrets
      - name: Assert security configuration
        run: pnpm security:config
      - name: Audit production dependencies
        run: pnpm audit --audit-level high --prod
      - name: Enforce frontend license policy
        run: pnpm license:frontend
      - name: Generate CycloneDX SBOM
        run: pnpm sbom:frontend
      - name: Retain frontend SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend-${{ github.sha }}
          path: work/sbom-frontend.cdx.json
          if-no-files-found: error
          retention-days: 90

  rust:
    name: Rust quality and security
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
      - name: Set up Node.js for frontend, policy, and SBOM scripts
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.14.0
      - name: Install pnpm for the locked frontend build
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build production frontend assets required by Tauri macros
        run: pnpm build
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "src-tauri -> target"
      - name: Verify formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check every Rust workspace target
        run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --locked
      - name: Install pinned Rust dependency auditor
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Enforce Rust license policy
        run: node scripts/rust-license-policy.mjs
      - name: Generate CycloneDX SBOM
        run: node scripts/generate-rust-sbom.mjs
      - name: Retain Rust SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-rust-${{ github.sha }}
          path: work/sbom-rust.cdx.json
          if-no-files-found: error
          retention-days: 90
